plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabdisplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.tabdisplay"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
